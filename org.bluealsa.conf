<!-- Host D-Bus policy for BlueALSA running in the container.
     Copy to /etc/dbus-1/system.d/ on the HOST and reload dbus
     (sudo systemctl reload dbus). Without it the host bus refuses
     the name org.bluealsa and bluealsa exits. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own_prefix="org.bluealsa"/>
    <allow send_destination="org.bluealsa"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.bluealsa"/>
  </policy>
</busconfig>